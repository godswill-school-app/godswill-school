name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/godswill/school
          cp MainActivity.kt app/src/main/java/com/godswill/school/
          echo 'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" } android { namespace "com.godswill.school"; compileSdk 34; defaultConfig { applicationId "com.godswill.school"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } } dependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.compose.ui:ui:1.5.4"; implementation "androidx.compose.material3:material3:1.1.2"; implementation "androidx.activity:activity-compose:1.8.2" }' > app/build.gradle
          echo 'include ":app"' > settings.gradle
          echo 'plugins { id "com.android.application" version "8.1.4" apply false; id "org.jetbrains.kotlin.android" version "1.9.10" apply false }' > build.gradle
          mkdir -p app/src/main
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gods Will School"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GodsWill-School-App
          path: app/build/outputs/apk/debug/*.apk
